// pédafiche autonome : l'application complète (Python + base de données) tourne sur le téléphone ou la tablette,
// sans PC serveur, sans Wi-Fi et sans Internet. Python est fourni par Chaquopy (https://chaquo.com/chaquopy/).
// Avant de fabriquer : python3 preparer.py (recopie le code pédafiche et les bibliothèques Python pures).
plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def cleFichier = System.getenv("PEDAFICHE_KEYSTORE") ?: "pedafiche-release.keystore"
def cleMdp = System.getenv("PEDAFICHE_KEYSTORE_PASSWORD") ?: "gescol-benin"
def cleAlias = System.getenv("PEDAFICHE_KEY_ALIAS") ?: "gescol"
def cleAliasMdp = System.getenv("PEDAFICHE_KEY_PASSWORD") ?: "gescol-benin"

android {
    namespace "bj.pedafiche.autonome"
    compileSdk 34

    defaultConfig {
        applicationId "bj.pedafiche.autonome"
        manifestPlaceholders = [appNom: "pédafiche"]
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.5.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile file(cleFichier)
            storePassword cleMdp
            keyAlias cleAlias
            keyPassword cleAliasMdp
            // v1.6 : signatures v1 + v2 + v3 (certains téléphones refusent un APK signé seulement en v2)
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        def py = System.getenv("PEDAFICHE_BUILD_PYTHON")
        if (py) {
            buildPython py
        }
        pip {
            // seule bibliothèque compilée nécessaire (images : logo, photos, signatures) ;
            // les bibliothèques Python pures sont recopiées par preparer.py dans src/main/python
            install "pillow"
            install "lxml"
        }
        pyc {
            src false
        }
        extractPackages "pedafiche", "reportlab"
    }
}

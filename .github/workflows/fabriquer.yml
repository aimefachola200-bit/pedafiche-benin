# Fabrique l'installateur Windows (.exe) et l'application Android autonome (.apk) de pédafiche.
# Onglet « Actions » > « Fabriquer pédafiche » > « Run workflow », ou publier une étiquette v2.4.0.
name: Fabriquer pédafiche
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
env:
  VERSION: "2.4.0"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/windows/pedafiche.spec --noconfirm --distpath dist --workpath build
      - name: Contrôle
        shell: pwsh
        run: |
          if (-not (Test-Path dist/PedaFiche/PedaFiche.exe)) { throw "PedaFiche.exe absent" }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${env:VERSION}" packaging\windows\pedafiche.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
      - uses: actions/upload-artifact@v4
        with:
          name: PedaFiche-Windows
          path: dist/PedaFiche-Installation-*.exe
  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Préparer le code Python
        run: python packaging/android_autonome/preparer.py
      - name: APK autonome
        env:
          PEDAFICHE_BUILD_PYTHON: python3.11
        run: |
          gradle -p packaging/android_autonome assembleRelease --no-daemon --stacktrace
          mkdir -p sortie
          cp packaging/android_autonome/app/build/outputs/apk/release/app-release.apk "sortie/PedaFiche-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PedaFiche-Android
          path: sortie/*.apk
  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: fichiers, merge-multiple: true }
      - name: Noms fixes pour les liens
        run: |
          cd fichiers
          cp PedaFiche-[0-9]*.apk PedaFiche.apk
          cp PedaFiche-Installation-*.exe PedaFiche-Installation.exe
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: pédafiche ${{ env.VERSION }}
          make_latest: "true"
          files: fichiers/*

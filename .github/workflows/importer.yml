# Met à jour les fiches de PédaFiche depuis SCOLARIS (dépôt public) puis enregistre le résultat.
# Onglet « Actions » > « Importer les fiches de SCOLARIS » > « Run workflow ».
name: Importer les fiches de SCOLARIS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aimefachola200-bit/scolaris
          path: _scolaris
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/importer_scolaris.py _scolaris
      - run: rm -rf _scolaris
      - name: Enregistrer
        run: |
          git config user.name "pedafiche-bot"
          git config user.email "pedafiche-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau." || git commit -m "Fiches et résumés importés de SCOLARIS"
          git push

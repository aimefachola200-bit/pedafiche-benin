    <clipPath id="feuille"><path d="M120 72h188l96 96v272a24 24 0 0 1-24 24H120a24 24 0 0 1-24-24V96a24 24 0 0 1 24-24z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>

{% extends "base.html" %}{% block corps %}<h1>Mon compte</h1><div class="carte" style="max-width:460px"><p>{{ user['prenom'] }} {{ user['nom'] }} — {{ user['role'] }} — identifiant « {{ user['identifiant'] }} »</p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="identifiant"><h2>Changer mon identifiant</h2>
<p><input name="identifiant" placeholder="Nouvel identifiant" required autocomplete="username" autocapitalize="none" pattern="[A-Za-z0-9._\-]{3,40}"></p><p><input type="password" name="mdp" placeholder="Mot de passe actuel" required autocomplete="current-password"></p><button class="btn">Changer l'identifiant</button></form></div>
<div class="carte" style="max-width:460px">
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><h2>Changer mon mot de passe</h2>
<p><input type="password" name="ancien" placeholder="Mot de passe actuel" required autocomplete="current-password"></p><p><input type="password" name="nouveau" placeholder="Nouveau (8+, lettres et chiffres)" required autocomplete="new-password"></p><p><input type="password" name="confirmation" placeholder="Confirmer" required autocomplete="new-password"></p><button class="btn">Changer</button></form></div>{% endblock %}
